<div class="login-container">
  <div class="login-card">
    
    <!-- Header -->
    <div class="login-header">
      <div class="logo">
        <h1>Droppershop</h1>
      </div>
      <p>Ingresa tus datos para iniciar sesión</p>
    </div>

    <!-- Global Error Message -->
    <div *ngIf="errorMessage()" class="error-alert" style="color: red; margin-bottom: 15px;">
        {{ errorMessage() }}
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- Input: Email -->
      <div class="form-group">
        <label for="email">Usuario</label>
        <div class="input-wrapper">
            <input type="email" id="email" formControlName="email" placeholder="Correo" [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        </div>
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
          <small *ngIf="loginForm.get('email')?.hasError('required')">El correo es requerido.</small>
          <small *ngIf="loginForm.get('email')?.hasError('email')">Ingresa un correo válido.</small>
        </div>
      </div>

      <!-- Input: Password -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
             <input type="password" id="password" formControlName="password" placeholder="Contraseña" [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        </div> 
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          <small *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es requerida.</small>
        </div>
      </div>

      <!-- Options: Remember Me & Forgot Password -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" formControlName="rememberMe"> Recordarme
        </label>
        <a href="#" class="forgot-password">¿Olvidó su contraseña?</a>
      </div>

      <!-- Submit -->
      <button type="submit">Iniciar Sesión</button>

      <!-- Footer -->
      <div class="login-footer">
        <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
      </div>
    </form>
  </div>
  
</div>
